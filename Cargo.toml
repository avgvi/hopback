[package]
name = "aiz"
version = "0.1.0"
edition = "2021"
description = "A fast, local-first CLI/TUI for finding, resuming, and natively forking AI coding sessions across Claude, Codex, and other agents."
license = "MIT"
repository = "https://github.com/augustlakia/aiz"
readme = "README.md"

[lib]
name = "aiz"
path = "src/lib.rs"

[[bin]]
name = "aiz"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nucleo-matcher = "0.3"
ratatui = "0.29"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
