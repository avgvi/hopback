[package]
name = "hopback"
version = "0.2.0"
edition = "2021"
default-run = "hopback"
description = "Find, resume and fork coding-agent sessions across Claude Code, Codex and more"
license = "MIT"
repository = "https://github.com/avgvi/hopback"
readme = "README.md"
keywords = ["cli", "tui", "claude-code", "codex", "coding-agents"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/src/**",
    "/tests/**",
    "/skills/**",
    "/man/**",
]

[lib]
name = "hopback"
path = "src/lib.rs"

[[bin]]
name = "hopback"
path = "src/main.rs"

[[bin]]
name = "hb"
path = "src/bin/hb.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nucleo-matcher = "0.3"
ratatui = "0.29"
clap_complete = "4"
clap_mangen = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
