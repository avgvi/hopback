name: crates.io

# Publishes the crate once the release workflow has finished for a version
# tag. Waiting for it means the GitHub Release and its binaries exist by the
# time the new version is on crates.io, which is where `cargo binstall` looks.
#
# Needs the repository secret CARGO_REGISTRY_TOKEN: a crates.io API token
# that can publish this crate.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish
    # The release workflow only runs on version tags, so a successful run of
    # it is a release. Started by hand, this publishes the checked-out ref.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
